name: Dependabot auto-merge

on:
    pull_request_target:

permissions:
    contents: write
    pull-requests: write

jobs:
    auto-merge:
        runs-on: ubuntu-latest
        if: github.actor == 'dependabot[bot]'
        steps:
            # GitHub forbids Actions from approving pull requests, so branch
            # protection still needs one human approval per PR. This job only
            # queues the merge; GitHub fires it once checks and the review pass.
            - name: Enable auto-merge
              run: gh pr merge "$PR_URL" --auto --merge
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  PR_URL: ${{ github.event.pull_request.html_url }}
